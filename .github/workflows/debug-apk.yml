name: Debug APK

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Each pinned action declares its own Node.js 24 runtime.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java for Gradle and the Android SDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Do not assume a hosted runner image has sdkmanager in PATH.
      - name: Install Android SDK 35 and build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and build the offline variant
        run: bash ./gradlew --no-daemon :app:testFreeDebugUnitTest :app:assembleFreeDebug
      - name: Verify the bundled soundbank
        run: python3 scripts/verify_audio.py --apk app/build/outputs/apk/free/debug/app-free-debug.apk
      - name: Verify the APK's Android compatibility declarations
        run: python3 scripts/verify_android_compatibility.py --apk app/build/outputs/apk/free/debug/app-free-debug.apk --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Noice-Fork-debug
          path: app/build/outputs/apk/free/debug/app-free-debug.apk
          if-no-files-found: error
