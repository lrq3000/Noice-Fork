plugins {
  id 'com.android.application'
  id 'kotlin-android'
}

apply from: 'jacoco.gradle'

android {
  namespace 'com.github.ashutoshgngwr.noice'
  compileSdkVersion 35
  buildToolsVersion '35.0.0'

  defaultConfig {
    applicationId 'io.github.lrq3000.noicefork'
    minSdkVersion 21
    targetSdkVersion 35
    versionCode 55
    versionName '1.5.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }

  buildFeatures {
    buildConfig true
    viewBinding true
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      // Instrumentation coverage is optional; do not instrument the APK distributed to users.
      enableAndroidTestCoverage = providers.gradleProperty('androidTestCoverage')
        .map { it.toBoolean() }.getOrElse(false)
    }

    release {
      shrinkResources true
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  flavorDimensions 'tier'
  productFlavors {
    free {
      dimension 'tier'
      buildConfigField 'boolean', 'IS_FREE_BUILD', 'true'
    }

    full {
      dimension 'tier'
      buildConfigField 'boolean', 'IS_FREE_BUILD', 'false'
    }
  }

  // Keep the upstream source for reference, but do not offer builds that need its Firebase project.
  variantFilter { variant ->
    if (variant.flavors.any { it.name == 'full' }) variant.setIgnore(true)
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
  }

  kotlinOptions {
    jvmTarget = 1.8
    freeCompilerArgs += ["-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"]
  }

  testOptions {
    unitTests {
      includeAndroidResources = true
      all {
        testLogging.events 'failed', 'skipped'
      }
    }
  }
}

dependencies {
  def fragmentVersion = '1.3.6'
  def testCoreVersion = '1.7.0'
  def junitVersion = '4.13.2'
  def mockkVersion = '1.12.0'
  def espressoVersion = '3.3.0'
  def coroutinesVersion = '1.5.2'

  // TODO: move this to stable release. The latest stable release (2.3.5) causes a crash with error
  //  `java.lang.RuntimeException: Unknown animation name: x`
  //  Although, the crash only occurs on the Play Store variant..?
  def navVersion = '2.4.0-alpha06'

  implementation 'androidx.activity:activity-ktx:1.3.1'
  implementation 'androidx.appcompat:appcompat:1.3.1'
  implementation 'androidx.browser:browser:1.3.0'
  implementation 'androidx.cardview:cardview:1.0.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
  implementation 'androidx.core:core-ktx:1.6.0'
  implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
  implementation "androidx.fragment:fragment-ktx:$fragmentVersion"
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
  implementation 'androidx.media:media:1.4.1'
  implementation 'androidx.mediarouter:mediarouter:1.2.5'
  implementation "androidx.navigation:navigation-fragment-ktx:$navVersion"
  implementation "androidx.navigation:navigation-ui-ktx:$navVersion"
  implementation 'androidx.preference:preference-ktx:1.1.1'
  implementation 'androidx.recyclerview:recyclerview:1.2.1'
  implementation 'com.github.AppIntro:AppIntro:6.1.0'
  implementation 'io.github.medyo:android-about-page:2.0.0'
  // The original JCenter-only versions are unavailable; these versions are published in Google Maven.
  implementation 'com.google.android.exoplayer:exoplayer-core:2.13.3'
  implementation 'com.google.android.flexbox:flexbox:3.0.0'
  implementation 'com.google.android.material:material:1.4.0'
  implementation 'com.google.code.gson:gson:2.8.8'
  implementation 'com.ncorti:slidetoact:0.9.0'
  implementation 'io.noties.markwon:core:4.6.2'
  implementation 'org.greenrobot:eventbus:3.1.1'
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  fullImplementation 'com.android.billingclient:billing-ktx:4.0.0'
  fullImplementation 'com.google.android.gms:play-services-base:17.6.0'
  fullImplementation 'com.google.android.gms:play-services-cast-framework:20.0.0'
  fullImplementation 'com.google.android.play:core:1.10.1'
  fullImplementation platform('com.google.firebase:firebase-bom:28.4.0')
  fullImplementation 'com.google.firebase:firebase-analytics-ktx'
  fullImplementation 'com.google.firebase:firebase-crashlytics-ktx'
  fullImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"


  testImplementation "androidx.test:core:$testCoreVersion"
  // Robolectric uses the modern AndroidX test stack; keep its annotations on the JVM test classpath only.
  testImplementation 'androidx.annotation:annotation:1.8.1'
  testImplementation "io.mockk:mockk:$mockkVersion"
  testImplementation "junit:junit:$junitVersion"
  testImplementation 'org.robolectric:robolectric:4.17'
  testImplementation 'org.skyscreamer:jsonassert:1.5.0'

  testFullImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"

  androidTestImplementation "androidx.test:core:$testCoreVersion"
  androidTestImplementation "androidx.test:rules:1.4.0"
  androidTestImplementation "androidx.test:runner:1.4.0"
  androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
  androidTestImplementation "androidx.test.espresso:espresso-contrib:$espressoVersion"
  androidTestImplementation "androidx.test.espresso:espresso-intents:$espressoVersion"
  androidTestImplementation 'androidx.test.ext:junit:1.1.3'
  androidTestImplementation "androidx.fragment:fragment-testing:$fragmentVersion"
  androidTestImplementation "io.mockk:mockk-android:$mockkVersion"
  androidTestImplementation "junit:junit:$junitVersion"

  androidTestFullImplementation 'tools.fastlane:screengrab:2.1.0'

  // FragmentScenario needs its host inside the app under test, not in the APK handed to users.
  if (providers.gradleProperty('deviceTests').map { it.toBoolean() }.getOrElse(false)) {
    debugImplementation "androidx.fragment:fragment-testing:$fragmentVersion"
    debugImplementation "androidx.test:core:$testCoreVersion"
  }
}
